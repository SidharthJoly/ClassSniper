name: Gym Logic Engine
on:
  schedule:
    # 5 minutes is GitHub's shortest supported interval — schedule triggers are
    # "best effort" and can still lag under load, so this only shrinks the worst
    # case gap, it doesn't guarantee precise timing. The script itself sleeps to
    # the exact strike moment once a run does start (see gym_script.py), so this
    # setting mainly matters for how late a run can start in the first place.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      class_date:
        description: 'Date (YYYY-MM-DD)'
        required: true
        default: '2026-04-12'
      class_time:
        description: 'Time (e.g., 3:30 PM)'
        required: true
        default: '3:30 PM'

permissions:
  contents: write

jobs:
  check_and_book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Target Class
        if: github.event_name == 'workflow_dispatch'
        env:
          CLASS_DATE: ${{ github.event.inputs.class_date }}
          CLASS_TIME: ${{ github.event.inputs.class_time }}
        run: |
          python3 - <<'EOF'
          import json, os

          date = os.environ["CLASS_DATE"]
          time = os.environ["CLASS_TIME"]

          try:
              with open("pending_booking.json") as f:
                  data = json.load(f)
          except FileNotFoundError:
              data = []

          if isinstance(data, dict):
              data = [data]
          elif not isinstance(data, list):
              data = []

          if not any(b.get("date") == date and b.get("time") == time for b in data):
              data.append({"date": date, "time": time})

          with open("pending_booking.json", "w") as f:
              json.dump(data, f, indent=2)
          EOF
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_booking.json
          git commit -m "Arming for ${{ github.event.inputs.class_time }} on ${{ github.event.inputs.class_date }}" || echo "No changes to commit"
          git push
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
      - name: Scrape Class List
        continue-on-error: true # don't let a scraper hiccup block the actual booking check
        run: python bot/scraper.py
      - name: Run Booker
        env:
          GYM_EMAIL: ${{ secrets.GYM_EMAIL }}
          GYM_PASSWORD: ${{ secrets.GYM_PASSWORD }}
        run: python bot/striker.py
      - name: Commit Status
        if: always()
        run: |
          git config --global user.name "GymBot"
          git config --global user.email "gymbot@users.noreply.github.com"
          git add status.json pending_booking.json class_list.json
          git commit -m "Update booking status and class list" || echo "No changes"
          git push
      - name: Upload Debug Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            final_failure.png
            booking_result.png
          if-no-files-found: ignore
